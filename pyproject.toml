[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-eval"
version = "0.2.0"
description = "Unified CSI evaluation framework — feedback compression & spatial-frequency prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CSI Evaluation Team"}
]
keywords = ["csi", "feedback", "compression", "prediction", "mimo", "5g", "6g",
           "neural-networks", "evaluation", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.5.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
vis = [
    "plotly>=5.0.0",
]
# 完整安装: pip install "csi-eval[all]"
all = [
    "csi-eval[dev,vis]",
]

[project.urls]
Homepage = "https://github.com/csieval/csieval"
Documentation = "https://github.com/csieval/csieval#readme"
Repository = "https://github.com/csieval/csieval"
Issues = "https://github.com/csieval/csieval/issues"

# 使包可通过 `python -m csi_eval` 运行
[project.scripts]
csi-eval = "csi_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["csi_eval", "csi_eval.pre_eval*", "csi_eval.feedback_eval*"]
exclude = [
    "csi_eval.pre_eval.tests*",
    "csi_eval.feedback_eval.tests*",
]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_functions = "test_*"
addopts = "-v --tb=short"
